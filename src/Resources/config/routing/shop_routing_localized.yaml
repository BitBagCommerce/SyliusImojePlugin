bitbag_ing_pay_initialize_payment:
  path: /payment/ing-pay/initialize_payment/{orderId}/{paymentMethodCode}/{blikCode}
  controller: bitbag.sylius_ing_pay_plugin.controller.shop.initialize_payment_controller
  defaults: {orderId: null, paymentMethodCode: null, blikCode: null}

bitbag_ing_pay_redirect:
  path: /payment/ing-pay/redirect/{status}/{paymentId}
  methods: [GET]
  controller: bitbag.sylius_ing_pay_plugin.controller.shop.redirect_controller

bitbag_ing_pay_one_click_redirect:
  path: /payment/ing-pay/oneclick/redirect/{status}/{paymentId}
  controller: bitbag.sylius_ing_pay_plugin.controller.shop.oneclick.redirect_one_click_controller
