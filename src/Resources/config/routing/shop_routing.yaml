bitbag_ing_pay_webhook:
  path: /payment/ing-pay/webhook
  controller: bitbag.sylius_ing_pay_plugin.controller.shop.webhook.webhook_controller

bitbag_ing_pay_localized:
  resource: "@BitBagSyliusIngPayPlugin/Resources/config/routing/shop_routing_localized.yaml"
  prefix: /{_locale}
  requirements:
    _locale: ^[a-z]{2}(?:_[A-Z]{2})?$

bitbag_one_click:
  path: /payment/oneclick/{orderId}
  methods: [ GET ]
  controller: bitbag.sylius_ing_pay_plugin.controller.shop.oneclick.one_click_controller
