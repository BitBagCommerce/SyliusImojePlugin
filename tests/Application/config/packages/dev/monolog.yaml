monolog:
    channels: ['ing_pay']

    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
        firephp:
            type: firephp
            level: info
        ing_pay:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%_ing_pay.log"
            level: debug
            channels: [ 'ing_pay' ]
