monolog:
    channels: ['ing_pay']

    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: error
        ing_pay:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%_ing_pay.log"
            level: error
            channels: [ 'ing_pay' ]
